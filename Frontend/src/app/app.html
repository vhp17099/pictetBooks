<div class="min-h-screen flex flex-col bg-[#FAF7F2]">
  <!-- Hero Banner Header -->
  <header class="relative bg-gradient-to-b from-[#443226] via-[#36251B] to-[#2B1D15] text-white py-12 px-4 shadow-md border-b border-amber-900/30 overflow-hidden">
    <!-- Subtle golden ambient background glow -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(245,158,11,0.15),transparent_65%)] pointer-events-none"></div>

    <div class="max-w-4xl mx-auto text-center relative z-10">
      <a [routerLink]="['/']" class="inline-block transition-transform hover:scale-[1.01] active:scale-[0.99] no-underline">
        <h1 class="font-serif text-3xl sm:text-4xl md:text-5xl font-bold tracking-normal text-[#F3D079] flex items-center justify-center gap-3 drop-shadow-sm">
          <span class="text-amber-400 text-2xl sm:text-3xl select-none">✨</span>
          <span>Adventure Awaits</span>
          <span class="text-amber-400 text-2xl sm:text-3xl select-none">✨</span>
        </h1>
      </a>

      <p class="mt-3 text-stone-300 text-sm sm:text-base max-w-2xl mx-auto leading-relaxed font-light">
        Embark on epic quests where every choice shapes your destiny. Explore mystical realms, solve ancient mysteries, and become the hero of your own story.
      </p>

      <div class="mt-5 inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-black/30 border border-amber-500/30 text-amber-200/90 text-xs sm:text-sm font-medium backdrop-blur-xs shadow-inner">
        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
        <span>{{bookList.length}} Epic Adventures Available</span>
        <span class="text-amber-400 select-none">✨</span>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <router-outlet />
  </main>
</div>
