<div class="bg-[#FFFDF9] rounded-2xl p-6 sm:p-7 border border-stone-200/90 shadow-xs hover:shadow-md transition-all duration-200 flex flex-col justify-between h-full group hover:border-amber-300/80">
  <div>
    <!-- Title & Author -->
    <h3
      class="font-serif text-xl sm:text-2xl font-bold text-stone-900 leading-snug tracking-normal group-hover:text-amber-950 transition-colors">
      {{ bookView().title }}
    </h3>
    <p class="text-xs sm:text-sm text-stone-500 font-medium mt-1 mb-4">
      by {{ bookView().author }}
    </p>

    <!-- Top Tags (Difficulty & Genre) -->
    <div class="flex flex-wrap gap-2 mt-4">
      <span [class]="'px-2.5 py-0.5 text-xs font-bold rounded-full border ' + difficultyStyle()">
        {{ formattedDifficulty() }}
      </span>
    </div>

    <!-- Action Button (Gradient background) -->
    <a 
      [routerLink]="['/adventure', bookView().id]"
      class="mt-6 w-full py-2.5 px-4 rounded-xl text-white font-medium text-sm bg-gradient-to-r from-[#D79A27] via-[#E4A936] to-[#EEBA4B] hover:from-[#C98B19] hover:to-[#E0A225] shadow-xs hover:shadow active:scale-[0.99] transition-all flex items-center justify-center gap-2 no-underline text-center cursor-pointer">
      <svg class="w-4 h-4 text-white fill-none shrink-0" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
      </svg>
      <span class="whitespace-nowrap font-medium">Begin Quest</span>
    </a>
  </div>
</div>
