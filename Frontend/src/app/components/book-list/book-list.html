
<section class="searchBar">
    <!-- Search Bar -->
    <div class="mt-6 max-w-md mx-auto relative">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <input
        type="text"
        [value]="searchTerm"
        (input)="filterResult(($any($event.target).value))"
        placeholder="Search adventures by title..."
        class="w-full pl-10 pr-4 py-2.5 bg-[#EFECE6] focus:bg-white text-stone-800 placeholder-stone-400 rounded-xl border border-stone-300/80 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none text-sm transition-all shadow-inner" />
    </div>
</section>

<section class="results">
  <!-- Book Cards Grid -->
  @if (filteredBookList.length > 0) {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-7 w-full max-w-6xl mx-auto mt-8 items-stretch">
      @for (bookView of filteredBookList; track bookView.id) {
        <app-book-item [bookView]="bookView" />
      }
    </div>
  } @else {
    <div class="text-center py-16 px-4 bg-white/60 rounded-2xl border border-stone-200/80 max-w-md mx-auto mt-8" #resetSearch>
      <span class="text-4xl">🔍</span>
      <h3 class="font-serif text-lg font-bold text-stone-800 mt-3">No adventures found</h3>
      <p class="text-stone-500 text-xs mt-1">Try adjusting your search query or removing active filters.</p>
      <button
        type="button"
        (click)="filterResult('')"
        class="mt-4 px-4 py-1.5 text-xs font-semibold text-amber-800 bg-amber-100 hover:bg-amber-200 rounded-lg border border-amber-300 cursor-pointer transition-colors">
        Reset Search & Filters
      </button>
    </div>
  }
</section>
